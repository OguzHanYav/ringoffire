<div *ngIf="game">

    <app-player (click)="editPlayer(i)" *ngFor="let player of game.players; let i = index"
        [playerActive]="i == game.currentPlayer" [image]="game.player_images[i]" [name]="player"
        [style.top.px]="30 + i * 70" class="hide-mobile">
    </app-player>

    <div class="scroll-container">
        <app-add-player-mobile (click)="editPlayer(i)" *ngFor="let player of game.players; let i = index"
            [playerActive]="i == game.currentPlayer" [image]="game.player_images[i]" [name]="player"
            class="hide-desktop">
        </app-add-player-mobile>

    </div>

    <div *ngIf="gameOver" class="gameOver">
        <img src="assets/img/game_over.svg" alt="">
    </div>
    <div *ngIf="!gameOver" class="field">
        <img class="preloadImage" src="assets/img/cards/{{game.stack[game.stack.length -1]}}.png" alt="">
        <div class="card-stack">
            <!-- Card stack-->
            <img [ngStyle]="{'right.px':i*5}" *ngFor="let c of [0,1,2,3,4]; let i = index;"
                src="assets/img/cards/card_cover.png" alt="">
            <img (click)="takeCard()" class="top-card" style="right: 25px;" src="assets/img/cards/card_cover.png"
                alt="">
            <!-- Stack for played cards-->
            <img *ngFor="let card of game.playedCards" class="played-cards" src="assets/img/cards/{{card}}.png" alt="">


            <!-- Current card (Animation)-->
            <img (click)="takeCard()" *ngIf="pickCardAnimation" class="pick-card" style="right: 25px;"
                src="assets/img/cards/{{currentCard}}.png" alt="">
        </div>
    </div>
    <app-game-info *ngIf="!gameOver" [card]="currentCard" class="pin-bottom"></app-game-info>

    <button *ngIf="!gameOver" mat-fab color="primary" (click)="openDialog()" class="btn-add">
        <mat-icon>add</mat-icon>
    </button>
</div>
